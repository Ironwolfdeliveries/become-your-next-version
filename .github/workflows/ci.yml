name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify guided experience and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test member experience and existing safeguards
        run: npm test

      - name: Verify page interactions with synthetic members
        run: |
          npm ci --prefix test/interaction --no-audit --no-fund
          node test/interaction/build.mjs
          node test/interaction/run.mjs
          node test/interaction/guidance.mjs
          node test/interaction/reset.mjs

      - name: Verify database preservation and accountability
        run: |
          npm ci --prefix test/database --no-audit --no-fund
          node test/database/verify.mjs

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://becomeyournextversion.com
